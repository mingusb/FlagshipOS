[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flagshipos"
version = "0.1.0"
description = "Seven Debian-family tool collections for Ubuntu 26.10 on WSL2, with MCP and NVIDIA CUDA support"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "Brian Mingus"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
]

[project.scripts]
flagship = "flagship.cli:main"

[project.optional-dependencies]
mcp = ["mcp==2.3.0"]

[project.urls]
Homepage = "https://github.com/mingusb/FlagshipOS"
Issues = "https://github.com/mingusb/FlagshipOS/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flagship = ["profiles.json", "recipes/*.Containerfile"]
